<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-wrap">
        <img src="images/back.png" id="backBtn" alt="Back">
        
        <div class="gallery">
            <div>
                <img src="images/confident.jpg" alt="Model 1" class="gallery-img">
                <img src="images/cool.jpg" alt="Model 2" class="gallery-img">
                <img src="images/strong.jpg" alt="Model 3" class="gallery-img">
                <img src="images/stylish.jpg" alt="Model 4" class="gallery-img">
                <img src="images/vibe.jpg" alt="Model 5" class="gallery-img">
                <img src="images/powerful.jpg" alt="Model 6" class="gallery-img">
                <img src="images/cute.jpg" alt="Model 7" class="gallery-img">
            </div>
        </div>

        <img src="images/next.png" id="nextBtn" alt="Next">
    </div>

    
    <div id="imageModal" class="modal">
        <span class="close-btn">&times;</span>
        <img class="modal-content" id="fullImg" alt="Selected Model">
    </div>

    <script src="script.js"></script>
</body>
</html>
